[workspace]
members = [
    "crates/lantern-core",
    "crates/lantern-store",
    "crates/lantern-service",
    "crates/lantern-app",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
iced = { version = "0.14.0", default-features = false, features = [
    "crisp",
    "linux-theme-detection",
    "thread-pool",
    "tiny-skia",
    "wayland",
    "x11",
] }
rfd = "0.17.2"
tempfile = "3"
thiserror = "2.0"

# Lantern uses Iced's CPU renderer to keep idle memory low. Optimizing third-party
# crates in development builds keeps scrolling responsive without making Lantern's
# own code harder to debug.
[profile.dev.package."*"]
opt-level = 3
