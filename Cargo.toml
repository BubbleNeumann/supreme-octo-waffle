[workspace]
members = [
    "crates/lantern-core",
    "crates/lantern-store",
    "crates/lantern-service",
    "crates/lantern-app",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
iced = { version = "0.14.0", default-features = false, features = [
    # Lantern draws its own text editor widget; see ui::text_editor.
    "advanced",
    "crisp",
    "linux-theme-detection",
    "thread-pool",
    "tiny-skia",
    "wayland",
    "x11",
] }
# Decoding the application icon: Iced takes an icon as raw pixels and brings
# no decoder of its own.
png = "0.18.1"
rfd = "0.17.2"
tempfile = "3"
# Embedding the Windows application icon into the executable at build time.
winresource = "0.1.31"
thiserror = "2.0"
# "display" writes the document order back out; themes only need to be read.
toml = { version = "1.1", default-features = false, features = [
    "display",
    "parse",
    "serde",
] }

# Lantern uses Iced's CPU renderer to keep idle memory low. Optimizing third-party
# crates in development builds keeps scrolling responsive without making Lantern's
# own code harder to debug.
[profile.dev.package."*"]
opt-level = 3
